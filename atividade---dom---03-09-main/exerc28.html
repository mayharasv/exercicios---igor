<!-- Faça um botão que só pode ser clicado uma vez (desabilite depois). -->

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>28</title>
        <script>
            function desabilitarBotao(){
                var botao = document.getElementById('botao')
                botao.disabled = true
            }

        </script>
    </head>
    <body>
        <button id="botao" onclick="desabilitarBotao()" >Clique aqui</button>

    </body>
</html>
