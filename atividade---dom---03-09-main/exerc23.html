<!-- Crie uma div que mude de cor quando o mouse passa por cima (onmouseover). -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>23</title>
        <script>
            function mudarCor(){
                var div = document.querySelector('div')
                div.style.backgroundColor = 'red'
            }


        </script>
    </head>
    <body>
            <div>
                <p> Miguel  </p>

            </div>

            <button onmouseover="mudarCor()">Passe o mouse aqui</button>


    </body>
</html>
