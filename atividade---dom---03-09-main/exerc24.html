<!-- Faça uma div voltar à cor original quando o 
mouse sai dela (onmouseout). -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>24</title>
        <script>
            function mudarCor(){
                var div = document.querySelector('div')
                div.style.backgroundColor = 'white'
            }

        </script>
    </head>
    <body>
            <div>
                <p> Miguel  </p>

            </div>

            <button onmouseover="mudarCor()">Passe o mouse aqui</button>



    </body>
</html>
