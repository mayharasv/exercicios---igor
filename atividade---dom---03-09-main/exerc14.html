<!-- Crie um quadrado (div) e um botão que 
altere sua largura para 300px. -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>14</title>
        <script>
           function aumentarLargura() {
                var div = document.querySelector("div")
                div.style.backgroundColor = "blue"
                div.style.height = "300px"
           }

        </script>
    </head>
    <body>
        <div></div>
        <button onclick="aumentarLargura()">Clique aqui</button>
    </body>
</html>
