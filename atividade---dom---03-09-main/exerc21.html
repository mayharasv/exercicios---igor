<!-- Crie um botão que, ao ser clicado, mostra um alerta 
"Você clicou no botão!". -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>21</title>
        <script>
            function clicarBotao(){
                alert('Você clicou no botão')
            }

        </script>
    </head>
    <body>
       <button onclick="clicarBotao()">Clicar no botão</button>


    </body>
</html>
