<!-- Faça um botão que conte quantos cliques já 
 foram feitos nele. -->

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>22</title>
        <script>

        var contador = 0  

        function contarCliques(){
            contador = contador + 1
            var p = document.querySelector('#p')
            p.innerHTML = contador

        }

        </script>
    </head>
    <body>
        <p> </p>
        <button id="botao" onclick="contarCliques">Clique aqui</button>
        

    </body>
</html>
