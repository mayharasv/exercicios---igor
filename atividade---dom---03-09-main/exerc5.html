            function alterarTitulo(){
                var titulo = document.querySelector('#titulo')
                titulo.innerText = "Título Alterado"
            }
        </script>

        <h1 id="titulo">Miguel Mora</h1>
        <button onclick="alterarTitulo()">Alterar</button>
