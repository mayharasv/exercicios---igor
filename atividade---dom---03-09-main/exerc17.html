<!-- Faça um botão que volte a exibir o parágrafo escondido. -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>17</title>
        <script>
           function mostrarParagrafo() {
            var p = document.getElementById('p')
            p.style.display = 'block'
           }

        </script>
    </head>
    <body>
       <p id="p" style="display: none;">Texto reaparecer</p>
       <button onclick="mostrarParagrafo()" >Mostrar</button>

    </body>
</html>
