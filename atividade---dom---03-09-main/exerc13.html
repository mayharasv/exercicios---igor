<!-- Faça um botão que altere a 
cor do texto de um <h1> para vermelho.  -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>13</title>
        <script>
            function mudarCor() {
                var h1 = document.querySelector('#h1')
                h1.style.color = 'red'
            }


        </script>
    </head>
    <body>
        <h1 id="h1">Texto em vermelho</h1>
        <button onclick="mudarCor()">Mudar Cor</button>
    </body>
</html>
