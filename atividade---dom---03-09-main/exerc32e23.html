Crie um botão que adiciona um item em uma lista (<ul>).

<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>3</title>
        <script>
            function adicionarItem(){
                var ul = document.querySelector('#ul')
                var li = document.createElement('li')
                li.textContent = 'Novo item'
                ul.appendChild(li)
            }
            function remove(){
                var li = document.querySelector('#aa')

        </script>
    </head>
    <body>
        <ul id="ul">

            <li>Item 2</li>
