<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3</title>
        <script>
            function horario(){

                var hora = new Date().getHours()
                var minuto = new Date().getMinutes()
                var segundo = new Date().getSeconds()

                var horario = hora + ':' + minuto + ':' + segundo

                document.querySelector('h2').innerHTML = horario
                
            }

        </script>
    </head>
    <body>
        <h2></h2>

        <button onclick="horario()">Clique aqui</button>
    </body>
</html>
