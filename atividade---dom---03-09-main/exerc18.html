<!-- Crie um botão que altere o estilo do texto para itálico. -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>18</title>
        <script>
           function mudarTexto(){
            var p = document.querySelector('p')
            p.style.fontStyle = 'italic'
           }

        </script>
    </head>
    <body>
       <p id='p'>Texto em itálico</p>
       <button onclick="mudarTexto()" >Mudar</button>

    </body>
</html>
