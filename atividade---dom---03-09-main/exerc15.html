<!-- Altere o fundo de um parágrafo para amarelo ao 
clicar em um botão. -->

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>15</title>
        <script>
            function mudarFundo() {
                var p = document.querySelector('#p')
                p.style.backgroundColor = 'yellow'
            }

        </script>
    </head>
    <body>
       <p id="p">Um parágrafo</p>
       <button onclick="mudarFundo()">Mudar Fundo</button>
    </body>
</html>
