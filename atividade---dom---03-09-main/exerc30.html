<!-- Crie um botão que, ao clicar, altera o próprio texto para "Clicado!". -->

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>30</title>
        <script>
            function alterarTexto() {
                var botao = document.getElementById('botao')
                botao.innerHTML = 'Clicado'

            }

        </script>
    </head>
    <body>
        <button id='botao' onclick='alterarTexto()'>Clique aqui</button>


    </body>
</html>
